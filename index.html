.hero-in{max-width:1040px;margin:0 auto;position:relative;z-index:2}

.topbar{display:flex;align-items:center;gap:20px}
.logo{height:38px;width:auto;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}



/* ============================ CONTEÚDO ============================ */
main{max-width:1040px;margin:-78px auto 0;padding:0 24px 64px;width:100%;flex:1;position:relative;z-index:5}

.bloco{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  box-shadow:var(--shadow-md); padding:26px 26px 28px; margin-bottom:20px;
}
.bloco-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.bloco-logo{
  width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  color:#fff;box-shadow:0 6px 16px rgba(11,21,36,.18);
}
.bloco-logo svg{width:22px;height:22px}
.bloco[data-fonte="teams"]      .bloco-logo{background:linear-gradient(140deg,#6E72D6,#4046A8)}
.bloco[data-fonte="databricks"] .bloco-logo{background:linear-gradient(140deg,#FF6A45,#D33C1B)}
.bloco[data-fonte="copilot"]    .bloco-logo{background:linear-gradient(140deg,#18A9A9,#0B6E6E)}
.bloco-head h2{font-size:17.5px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.bloco-head p{font-size:12.5px;color:var(--text-soft);margin-top:3px}
.contador{
  margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--text-soft);
  border:1px solid var(--border);padding:5px 11px;border-radius:999px;white-space:nowrap;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}

.card{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--bg);border:1px solid var(--border);border-radius:16px;
  padding:17px 18px;position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cor,var(--brand));
  transform:scaleY(0);transform-origin:bottom;transition:transform .22s cubic-bezier(.2,.7,.3,1);
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(11,21,36,.13), 0 0 0 4px var(--ring);
  border-color:var(--cor,var(--brand)); background:var(--surface);
}
.card:hover::before{transform:scaleY(1)}
.card:focus-visible{outline:3px solid var(--brand-accent);outline-offset:3px}

.card-icon{
  width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cor,var(--brand)) 13%,transparent);
  color:var(--cor,var(--brand));
}
.card-icon svg{width:21px;height:21px}
.card-body{flex:1;min-width:0}
.card-body strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px}
.card-body span{display:block;font-size:12.5px;color:var(--text-soft);margin-top:3px;line-height:1.4}
.seta{flex:none;opacity:.28;transition:.2s}
.card:hover .seta{opacity:1;transform:translateX(3px);color:var(--cor,var(--brand))}

.card.pendente{border-style:dashed;cursor:not-allowed;opacity:.72}
.card.pendente:hover{transform:none;box-shadow:none;border-color:var(--border);background:var(--bg)}
.card.pendente:hover::before{transform:scaleY(0)}
.card-body span.tag{
  display:inline-block;width:auto;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--brand-accent);
  background:color-mix(in srgb,var(--brand-accent) 17%,transparent);
  padding:3px 9px;border-radius:999px;
}

/* ============================ RODAPÉ ============================ */
footer{
  border-top:1px solid var(--border);background:var(--surface);
  padding:26px 24px;
}
.foot-in{
  max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft);
}
.foot-logo{height:26px;width:auto;opacity:.75}

@media(max-width:640px){
  .hero{padding:22px 18px 104px}
    main{margin-top:-72px;padding:0 16px 44px}
  .bloco{padding:20px 18px 22px;border-radius:20px}
  .grid{grid-template-columns:1fr}
  .contador{display:none}
  .logo{height:30px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>

   ------------------------------------------------------------------
   Para adicionar um botão, copie uma linha e troque nome/descricao/link.
   Link vazio ("") = botão aparece como "link pendente".
   ================================================================== */

  {
    id:"teams", nome:"Microsoft Teams", subtitulo:"Aplicativos dos agentes no Teams",
    botoes:[
      { nome:"AED002 — Vendas", descricao:"Aplicativo do agente no Teams",

      { nome:"AED005 — LEGIX", descricao:"Aplicativo do agente no Teams",
        link:"https://teams.microsoft.com/l/app/ea8d9d93-2c68-4399-a35c-4c13a1896140?source=store-item" }
    ]
  },
  {
    id:"databricks", nome:"Databricks", subtitulo:"Agentes na plataforma de dados",
    botoes:[
      { nome:"AED002 — Vendas", descricao:"Agente no Databricks",
        link:"https://4196025774398434.4.gcp.databricks.com/genie/rooms/01f0ea30beb119bda2c3a7a6dfcf78bd?o=4196025774398434" },
      { nome:"AED009 — S&OP", descricao:"Agente no Databricks",

    id:"copilot", nome:"Copilot", subtitulo:"Aplicativo e versão web",
    botoes:[
      { nome:"Copilot Desktop", descricao:"Instalar pela Microsoft Store",
        link:"https://apps.microsoft.com/detail/9WZDNCRD29V9?hl=pt-br&gl=BR&ocid=pdpshare" },
      { nome:"Copilot Online", descricao:"Acesso pelo navegador",
        link:"https://copilot.com/" }
    ]
  }
];

/* ==================================================================
   3) MOTOR — não precisa mexer daqui pra baixo
   ================================================================== */
const $ = s => document.querySelector(s);

const ICONES = {
  teams:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 21l1.9-5a8.4 8.4 0 0 1 3.3-11.4 8.9 8.9 0 0 1 11.3 3.1 8.3 8.3 0 0 1 1.5 3.8Z"/></svg>`,
  databricks:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5L21 12"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>`,

};
const seta = `<svg class="seta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>`;

$("#cfg-rodape").textContent = CONFIG.rodape;
document.title = CONFIG.titulo + " | WAP";

function montarCard(b, fonteId){
  const ativo = b.link && b.link.trim() !== "" && b.link !== "#";
  const estilo = `--cor:var(--${fonteId})`;
  const corpo =
    `<strong>${b.nome}</strong>` +
    (b.descricao ? `<span>${b.descricao}</span>` : "") +
    (ativo ? "" : `<span class="tag">link pendente</span>`);
  const interno = `<div class="card-icon">${ICONES[fonteId]}</div><div class="card-body">${corpo}</div>${seta}`;
  return ativo
    ? `<a class="card" style="${estilo}" href="${b.link}" target="_blank" rel="noopener noreferrer">${interno}</a>`
    : `<div class="card pendente" style="${estilo}" aria-disabled="true">${interno}</div>`;
}

$("#content").innerHTML = FONTES.map(f => {
  const ativos = f.botoes.filter(b => b.link && b.link.trim() !== "").length;
  return `
  <section class="bloco" data-fonte="${f.id}">
    <div class="bloco-head">
      <div class="bloco-logo">${ICONES[f.id]}</div>
      <div><h2>${f.nome}</h2><p>${f.subtitulo || ""}</p></div>
      <span class="contador">${ativos} de ${f.botoes.length} ativos</span>
    </div>
    <div class="grid">${f.botoes.map(b => montarCard(b, f.id)).join("")}</div>
  </section>`;
}).join("");

/* tema fixo: claro */
document.documentElement.setAttribute("data-theme","light");
